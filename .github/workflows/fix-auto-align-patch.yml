name: Fix Auto Align patch helper

on:
  push:
    paths:
      - 'scripts/.fix-auto-align-helper'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix helper and requeue guarded patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_auto_align_patch.py')
          s=p.read_text()
          old='new_bind=old_bind[:-1]+"$(\'autoAlignBtn\').onclick=startAutoAlign;updateAutoAlignButton();"'
          new='new_bind=old_bind+"$(\'autoAlignBtn\').onclick=startAutoAlign;updateAutoAlignButton();"'
          if old not in s: raise SystemExit('expected helper line not found')
          p.write_text(s.replace(old,new,1))
          PY
          python3 -m py_compile scripts/apply_auto_align_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_auto_align_patch.py
          git commit -m 'ci: fix Auto Align patch helper'
          git push origin HEAD:main
