name: Apply Roblox shortcut guard patch

on:
  push:
    paths:
      - 'scripts/studio-shortcuts.patch.gz.b64'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/studio-shortcuts.patch.gz.b64 | gzip -d > /tmp/studio.patch
          git apply --check /tmp/studio.patch
          git apply /tmp/studio.patch
          node --check src/studio-settings.js
          node --test tests/*.test.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/studio-settings.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: let editor shortcuts bypass Roblox WASD capture'
          git push origin HEAD:main
