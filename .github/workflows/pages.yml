name: Build and deploy VEX CAD
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache generated VEX mesh library
        id: vex-cache
        uses: actions/cache@v4
        with:
          path: .vex-parts-cache
          key: vex-iq-2024-11-08-meshcache-v2
      - name: Build VEX geometry cache
        if: steps.vex-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --disable-pip-version-check cadquery numpy
          mkdir -p .vex-parts-cache
          python tools/build_parts.py --out .vex-parts-cache
      - name: Stage geometry cache
        run: |
          rm -rf public/parts
          mkdir -p public/parts
          cp -R .vex-parts-cache/. public/parts/
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
