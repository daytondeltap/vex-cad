name: Build and deploy VEX CAD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test editor core
        run: node --test tests/*.test.mjs

      - name: Restore generated VEX mesh library
        id: vex-cache
        uses: actions/cache/restore@v4
        with:
          path: .vex-parts-cache
          key: vex-iq-github-step-mirror-v3

      - name: Generate real VEX IQ geometry cache
        if: steps.vex-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --disable-pip-version-check cadquery
          rm -rf .vex-parts-cache
          curl --fail --location --retry 5 --retry-all-errors \
            'https://codeload.github.com/vex-ru/vex-iq-stl/zip/refs/heads/main' \
            -o "$RUNNER_TEMP/vex-iq-step-mirror.zip"
          test -s "$RUNNER_TEMP/vex-iq-step-mirror.zip"
          python tools/build_parts.py \
            --zip "$RUNNER_TEMP/vex-iq-step-mirror.zip" \
            --out .vex-parts-cache

      - name: Save generated VEX mesh library
        if: steps.vex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vex-parts-cache
          key: vex-iq-github-step-mirror-v3

      - name: Restore pinned browser runtimes
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .browser-runtime-cache
          key: vex-cad-browser-runtime-three-0.185.1-occt-0.0.28-v1

      - name: Build pinned browser runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .browser-runtime-cache node_modules
          mkdir -p .browser-runtime-cache/vendor/addons/controls .browser-runtime-cache/occt
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.185.1 @sunbox/occt-import-js@0.0.28
          cp node_modules/three/build/three.module.js .browser-runtime-cache/vendor/three.module.js
          cp node_modules/three/examples/jsm/controls/OrbitControls.js .browser-runtime-cache/vendor/addons/controls/OrbitControls.js
          cp node_modules/three/examples/jsm/controls/TransformControls.js .browser-runtime-cache/vendor/addons/controls/TransformControls.js
          cp node_modules/@sunbox/occt-import-js/dist/occt-import-js-worker.js .browser-runtime-cache/occt/occt-import-js-worker.js
          cp node_modules/@sunbox/occt-import-js/dist/occt-import-js.js .browser-runtime-cache/occt/occt-import-js.js
          cp node_modules/@sunbox/occt-import-js/dist/occt-import-js.wasm .browser-runtime-cache/occt/occt-import-js.wasm

      - name: Save pinned browser runtimes
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .browser-runtime-cache
          key: vex-cad-browser-runtime-three-0.185.1-occt-0.0.28-v1

      - name: Stage static site
        run: |
          rm -rf dist
          mkdir -p dist/parts
          cp index.html styles.css dist/
          cp -R src dist/src
          cp -R .vex-parts-cache/. dist/parts/
          cp -R .browser-runtime-cache/vendor dist/vendor
          cp -R .browser-runtime-cache/occt dist/occt

      - name: Validate generated assets and source
        run: |
          node scripts/check-assets.mjs dist/parts/manifest.json
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          test -s dist/vendor/three.module.js
          test -s dist/vendor/addons/controls/OrbitControls.js
          test -s dist/vendor/addons/controls/TransformControls.js
          test -s dist/occt/occt-import-js-worker.js
          test -s dist/occt/occt-import-js.js
          test -s dist/occt/occt-import-js.wasm
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
