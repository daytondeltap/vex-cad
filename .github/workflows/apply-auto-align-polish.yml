name: Apply Auto Align polish

on:
  push:
    paths:
      - 'scripts/.auto-align-polish'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Auto Align takeover behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app-stable.js')
          s=p.read_text()
          old="btn.disabled=state.selection.size!==2||!!placement;"
          new="btn.disabled=state.selection.size!==2;"
          assert old in s, 'Auto Align enable predicate changed unexpectedly'
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('tests/core.test.mjs')
          ts=t.read_text()
          needle="test('bare beam receptacles cannot connect directly'"
          if "standoff connector is compatible with a beam hole" not in ts:
              i=ts.index(needle)
              ts=ts[:i]+"test('standoff connector is compatible with a beam hole',()=>{assert.equal(compatible({type:'standoff'},{type:'hole'}),true);assert.equal(compatible({type:'standoff'},{type:'socket'}),true);assert.equal(compatible({type:'standoff'},{type:'standoff'}),false)});\n"+ts[i:]
              t.write_text(ts)
          PY
          node --check src/app-stable.js
          node --test tests/*.test.mjs
      - name: Commit polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app-stable.js tests/core.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: let Auto Align take over from placement mode'
          git push origin HEAD:main
