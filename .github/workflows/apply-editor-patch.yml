name: Apply editor feature patch

on:
  push:
    paths:
      - 'scripts/editor-features.patch.gz.b64'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply guarded editor patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/editor-features.patch.gz.b64 | gzip -d > /tmp/editor-features.patch
          git apply --check /tmp/editor-features.patch
          git apply /tmp/editor-features.patch
          node --check src/app-stable.js
          node --test tests/*.test.mjs
      - name: Commit editor features
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app-stable.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add grouping clipboard and physical snap occupancy'
          git push origin HEAD:main
